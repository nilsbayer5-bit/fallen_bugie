# /home/nils/fallen_bugie/docker-compose.yml
version: '3.8'

services:
  # 1. Der Postbote (Redis)
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    ports:
      - "6379:6379"

  # 2. Dein FastAPI Backend
  backend:
    build: ./backend
    container_name: aegis_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # 3. Der Celery Worker (Die Muskeln)
  worker:
    build: ./backend
    container_name: aegis_worker
    command: celery -A app.celery_app.celery worker -Q scans -l info
    depends_on:
      - redis
      - backend

  # 4. Der Celery Beat (Der Wecker für Cronjobs)
  beat:
    build: ./backend
    container_name: aegis_beat
    command: celery -A app.celery_app.celery beat -l info
    depends_on:
      - redis

  # 5. Das React Dashboard
  frontend:
    build: ./frontend
    container_name: aegis_frontend
    ports:
      - "5173:80" # Verbindet deinen lokalen Port 5173 mit dem Nginx im Container
    depends_on:
      - backend